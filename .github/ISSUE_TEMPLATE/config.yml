blank_issues_enabled: false
contact_links:
  - name: Security vulnerability
    url: https://github.com/m6bernha/lyripop/security/advisories/new
    about: Use private GitHub security advisories instead of public issues for any security concern.
  - name: Spotify Web API limitation
    url: https://developer.spotify.com/documentation/web-api
    about: If something works in Spotify's own apps but not Lyripop, it might be a Web API limit (rate limits, scope gates, dev-mode 25-user cap). Check Spotify's docs first.
  - name: Lyrics not found / wrong / out of sync
    url: https://lrclib.net
    about: Lyrics come from lrclib.net (open community database). Wrong lyrics = please contribute corrections to lrclib upstream — we just display what they have.
