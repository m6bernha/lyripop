name: Release

on:
  push:
    tags:
      - "v*"

# Required for actions/attest-build-provenance and gh-release upload.
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build Windows MSI
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (Tauri)
        # Produces unsigned MSI + NSIS installer at:
        #   src-tauri/target/release/bundle/msi/*.msi
        #   src-tauri/target/release/bundle/nsis/*.exe
        run: pnpm tauri build

      # TODO once SignPath OSS sponsorship is approved:
      #   - uses: actions/upload-artifact@v4
      #     with: { name: lyripop-msi-unsigned, path: src-tauri/target/release/bundle/msi/*.msi }
      #   - uses: signpath/github-action-submit-signing-request@v2
      #     with:
      #       api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #       organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
      #       project-slug: lyripop
      #       signing-policy-slug: release-signing
      #       github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
      #       wait-for-completion: true
      #       output-artifact-directory: src-tauri/target/release/bundle/msi/
      # Until then, ship unsigned with SmartScreen warning documented in README.

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1
          $exe = Get-ChildItem -Path src-tauri/target/release/bundle/nsis/*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          $hashes = @()
          if ($msi) { $hashes += "$((Get-FileHash -Algorithm SHA256 $msi.FullName).Hash.ToLower())  $($msi.Name)" }
          if ($exe) { $hashes += "$((Get-FileHash -Algorithm SHA256 $exe.FullName).Hash.ToLower())  $($exe.Name)" }
          $hashes -join "`n" | Out-File -FilePath SHA256SUMS.txt -Encoding ascii -NoNewline
          Get-Content SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            SHA256SUMS.txt
